<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F2E8D8; -webkit-font-smoothing: antialiased; }
    a { color: #C8783A; text-decoration: none; }
    a:hover { color: #8A5024; }
  </style>
</helmet>
<div style="width: 780px; height: 560px; background: #F2E8D8; box-sizing: border-box; padding: 44px 48px; display: flex; gap: 36px; font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; color: #2A1A12;">

  <div style="flex: 0 0 268px; display: flex; align-items: center;">
    <svg viewBox="190 84 280 306" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display: block;" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The coffee bean character holding a scrub brush">
      <g transform="translate(244,296) rotate(18)">
        <rect x="-13" y="-70" width="26" height="82" rx="12" fill="#C8783A"></rect>
        <rect x="-33" y="8" width="66" height="34" rx="11" fill="#7A4A24"></rect>
        <g stroke="#F7F1E6" stroke-width="6" stroke-linecap="round">
          <line x1="-21" y1="44" x2="-21" y2="66"></line>
          <line x1="-7" y1="44" x2="-7" y2="70"></line>
          <line x1="7" y1="44" x2="7" y2="68"></line>
          <line x1="21" y1="44" x2="21" y2="62"></line>
        </g>
      </g>
      <g transform="translate(354,180)">
        <path d="M -54 14 C -74 32, -84 52, -92 69" fill="none" stroke="#3B2418" stroke-width="16" stroke-linecap="round"></path>
        <path d="M 54 6 C 84 0, 96 -22, 92 -44" fill="none" stroke="#3B2418" stroke-width="16" stroke-linecap="round"></path>
        <ellipse cx="-20" cy="86" rx="20" ry="11" fill="#2A1A12"></ellipse>
        <ellipse cx="22" cy="88" rx="20" ry="11" fill="#2A1A12"></ellipse>
        <g transform="rotate(-8)">
          <ellipse cx="0" cy="0" rx="62" ry="82" fill="#3B2418"></ellipse>
          <path d="M -42 -52 C -58 -22, -56 22, -38 54" fill="none" stroke="#58351F" stroke-width="13" stroke-linecap="round"></path>
          <path d="M 0 -78 C -18 -46, 18 -14, 0 18 C -16 46, 6 60, 0 78" fill="none" stroke="#C8783A" stroke-width="9" stroke-linecap="round"></path>
        </g>
        <circle cx="-24" cy="-18" r="12" fill="#F7F1E6"></circle>
        <circle cx="18" cy="-24" r="12" fill="#F7F1E6"></circle>
        <circle cx="-20" cy="-16" r="6" fill="#2A1A12"></circle>
        <circle cx="22" cy="-22" r="6" fill="#2A1A12"></circle>
        <path d="M -18 16 C -6 30, 12 28, 20 12" fill="none" stroke="#F7F1E6" stroke-width="6" stroke-linecap="round"></path>
        <circle cx="-92" cy="71" r="14" fill="#58351F"></circle>
        <circle cx="92" cy="-46" r="14" fill="#58351F"></circle>
      </g>
    </svg>
  </div>

  <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
    <div>
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #6E5C2F;">Asset sheet</div>
      <div style="font-family: 'Alfa Slab One', Rockwell, Georgia, serif; font-size: 38px; line-height: 1.05; margin-top: 8px;">The mark &amp; palette</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #F2E8D8; box-shadow: inset 0 0 0 1px rgba(42,26,18,0.25);"></span><span style="font-size: 14px; line-height: 1.3;">Paper<br><span style="color: #6E5C2F;">#F2E8D8</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #2A1A12;"></span><span style="font-size: 14px; line-height: 1.3;">Espresso<br><span style="color: #6E5C2F;">#2A1A12</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #3B2418;"></span><span style="font-size: 14px; line-height: 1.3;">Bean<br><span style="color: #6E5C2F;">#3B2418</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #C8783A;"></span><span style="font-size: 14px; line-height: 1.3;">Crema<br><span style="color: #6E5C2F;">#C8783A</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #E0906E;"></span><span style="font-size: 14px; line-height: 1.3;">Tissue<br><span style="color: #6E5C2F;">#E0906E</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #6E5C2F;"></span><span style="font-size: 14px; line-height: 1.3;">Grease<br><span style="color: #6E5C2F;">#6E5C2F</span></span></div>
      <div style="display: flex; align-items: center; gap: 12px;"><span style="width: 38px; height: 38px; border-radius: 8px; background: #2E9270;"></span><span style="font-size: 14px; line-height: 1.3;">Fresh<br><span style="color: #6E5C2F;">#2E9270</span></span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(42,26,18,0.18); padding-top: 18px;">
      <div style="font-family: 'Alfa Slab One', Rockwell, Georgia, serif; font-size: 26px;">Alfa Slab One</div>
      <div style="font-size: 13px; color: #6E5C2F;">Headlines, all caps. Falls back to Rockwell / Georgia.</div>
      <div style="font-size: 20px; font-weight: 500; margin-top: 6px;">Work Sans &mdash; body &amp; labels</div>
      <div style="font-size: 13px; color: #6E5C2F;">400 for copy, 600 for the uppercase pills and bands.</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
