<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #EFE9DD; -webkit-font-smoothing: antialiased; }
    a { color: #C8783A; text-decoration: none; }
    a:hover { color: #8A5024; }
  </style>
</helmet>
<div style="width: 540px; height: 675px; background: #EFE9DD; box-sizing: border-box; padding: 36px 34px; display: flex; flex-direction: column; gap: 20px; font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; color: #2E2A24;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8A806E;">Direction C</div>
    <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #B4A992;">Sketch</div>
  </div>

  <div style="font-family: 'Caveat', 'Bradley Hand', cursive; font-size: 40px; line-height: 1; color: #241F19;">Comic panel</div>

  <div style="flex: 1 1 auto; min-height: 0; border: 3px solid #241F19; border-radius: 2px; padding: 10px; display: flex; align-items: center; background-image: radial-gradient(#241F19 1.4px, transparent 1.5px); background-size: 12px 12px; background-position: 0 0;">
    <svg viewBox="0 0 440 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display: block;" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sketch: comic-panel treatment with the bean mid-scrub and a hand-lettered sound effect">

      <path d="M 220 40 l 26 52 l 54 -30 l -18 56 l 60 6 l -44 38 l 52 30 l -60 12 l 26 52 l -56 -22 l -6 60 l -34 -50 l -34 50 l -6 -60 l -56 22 l 26 -52 l -60 -12 l 52 -30 l -44 -38 l 60 -6 l -18 -56 l 54 30 z" fill="#F5F0E6" stroke="#241F19" stroke-width="3" stroke-linejoin="round"></path>

      <g stroke="#241F19" stroke-width="3" stroke-linecap="round">
        <line x1="330" y1="150" x2="392" y2="132"></line>
        <line x1="336" y1="188" x2="404" y2="188"></line>
        <line x1="330" y1="226" x2="392" y2="244"></line>
      </g>

      <g transform="translate(196,196)">
        <ellipse cx="0" cy="0" rx="52" ry="70" fill="#241F19"></ellipse>
        <path d="M 0 -66 C -14 -38, 14 -12, 0 14 C -12 38, 4 50, 0 66" fill="none" stroke="#EFE9DD" stroke-width="7" stroke-linecap="round"></path>
        <circle cx="-20" cy="-16" r="10" fill="#EFE9DD"></circle>

        <circle cx="-17" cy="-14" r="5" fill="#241F19"></circle>
        <circle cx="19" cy="-18" r="5" fill="#241F19"></circle>
        <path d="M -16 16 C -4 32, 14 28, 20 10" fill="none" stroke="#EFE9DD" stroke-width="6" stroke-linecap="round"></path>
        <path d="M -46 6 C -70 24, -78 44, -84 60" fill="none" stroke="#241F19" stroke-width="14" stroke-linecap="round"></path>
      </g>

      <g transform="translate(104,268) rotate(24)">
        <rect x="-10" y="-52" width="20" height="60" rx="8" fill="#C8783A" stroke="#241F19" stroke-width="3"></rect>
        <rect x="-26" y="6" width="52" height="26" rx="6" fill="#F5F0E6" stroke="#241F19" stroke-width="3"></rect>
      </g>

      <g fill="#C8783A">
        <circle cx="78" cy="196" r="13"></circle>
        <circle cx="52" cy="232" r="9"></circle>
        <circle cx="98" cy="158" r="7"></circle>

      <text x="250" y="348" text-anchor="middle" font-family="Caveat, 'Bradley Hand', cursive" font-size="52" font-weight="700" fill="#241F19" transform="rotate(-8 250 348)">SQUEAKY!</text>
    </svg>
  </div>

  <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #4A4238;">Turns the clean-up into an action beat: halftone panel, sound effect, heavy outline. <strong style="font-weight: 600;">Trade-off:</strong> stops the scroll and gets shared, but it reads novelty-snack, not something you take for your gut before bed.</p>

</div>
</x-dc>
</body>
</html>
