<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F1F0EC; -webkit-font-smoothing: antialiased; }
    a { color: #2E9270; text-decoration: none; }
    a:hover { color: #1F6A50; }
  </style>
</helmet>
<div style="width: 540px; height: 675px; background: #F1F0EC; box-sizing: border-box; padding: 36px 34px; display: flex; flex-direction: column; gap: 20px; font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; color: #3A3A36;">

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #8A867C;">Direction B</div>
    <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #B4AFA3;">Sketch</div>
  </div>

  <div style="font-family: 'Caveat', 'Bradley Hand', cursive; font-size: 40px; line-height: 1; color: #2A2A26;">Clinical cutaway</div>

  <div style="flex: 1 1 auto; min-height: 0; border: 1px dashed #C6C2B8; border-radius: 4px; padding: 14px; display: flex; align-items: center;">
    <svg viewBox="0 0 440 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="display: block;" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wireframe sketch: a labelled cutaway diagram of the gut wall with a bean icon">

      <g stroke="#8A867C" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M 26 190 C 120 140, 230 140, 320 190 C 366 216, 400 214, 424 202"></path>
        <path d="M 26 262 C 120 212, 230 212, 320 262 C 366 288, 400 286, 424 274"></path>
        <path d="M 26 190 L 26 262"></path>
        <path d="M 424 202 L 424 274"></path>
      </g>

      <g stroke="#8A867C" stroke-width="1.4" opacity="0.85">
        <line x1="46" y1="185" x2="66" y2="253"></line>
        <line x1="76" y1="172" x2="96" y2="240"></line>
        <line x1="106" y1="163" x2="126" y2="231"></line>
        <line x1="136" y1="157" x2="156" y2="225"></line>
        <line x1="166" y1="153" x2="186" y2="221"></line>
      </g>

      <g stroke="#2E9270" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M 296 224 l 12 13 l 24 -28"></path>
        <path d="M 356 236 l 12 13 l 24 -28"></path>
      </g>

      <g transform="translate(112,92)">
        <ellipse cx="0" cy="0" rx="30" ry="40" fill="none" stroke="#3A3A36" stroke-width="2.5"></ellipse>
        <path d="M 0 -38 C -9 -22, 9 -8, 0 8 C -8 22, 3 30, 0 38" fill="none" stroke="#3A3A36" stroke-width="2.5" stroke-linecap="round"></path>
        <path d="M 26 18 L 54 44" stroke="#3A3A36" stroke-width="2.5" stroke-linecap="round"></path>
        <rect x="46" y="42" width="30" height="14" rx="3" fill="none" stroke="#3A3A36" stroke-width="2.5" transform="rotate(-38 61 49)"></rect>
      </g>

      <g stroke="#B4AFA3" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
        <path d="M 104 200 L 74 320"></path>
        <path d="M 344 236 L 372 336"></path>
      </g>

      <g font-family="Caveat, 'Bradley Hand', cursive" font-size="25" fill="#4A4A44">
        <text x="30" y="344">greasy film</text>
        <text x="300" y="360">clean wall</text>
        <text x="432" y="86" text-anchor="end" font-size="21">the bean does the work</text>
      </g>
    </svg>
  </div>

  <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #55534C;">Explains the mechanism instead of dramatising it: labelled diagram, cool neutrals, one green tick for the &ldquo;after&rdquo;. <strong style="font-weight: 600;">Trade-off:</strong> credible and calm, but it scrolls past &mdash; there is no character to remember.</p>

</div>
</x-dc>
</body>
</html>
